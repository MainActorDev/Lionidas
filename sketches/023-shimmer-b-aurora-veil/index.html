<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>shimmer B — aurora veil</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-void); color: var(--color-paper); font-family: var(--font-mono); font-size: var(--text-label); min-height: 100vh; display: grid; place-items: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .phone { position: relative; width: 268px; height: 550px; background: var(--color-carbon); border: 1px solid var(--color-slate); border-radius: 22px; padding: 10px; }
  .screen { position: relative; width: 100%; height: 100%; background: var(--color-void); border-radius: 12px; overflow: hidden; }

  /* ── VARIANT B: aurora veil ──
   * No fake content — two soft, slow light veils (one cool paper-white, one
   * ember) drifting at different speeds and directions, like faint auroras
   * behind smoked glass. Calm, premium, uncluttered; says "waking up"
   * rather than "painting a layout". */
  .veil { position: absolute; width: 160%; height: 70%; filter: blur(38px); opacity: .16; border-radius: 50%; }
  .veil.cool { top: -18%; left: -30%; background: radial-gradient(closest-side, var(--color-paper), transparent 70%); animation: drift1 5.2s ease-in-out infinite alternate; }
  .veil.warm { bottom: -22%; right: -34%; background: radial-gradient(closest-side, var(--color-ember), transparent 72%); animation: drift2 6.8s ease-in-out infinite alternate; opacity: .13; }
  @keyframes drift1 {
    from { transform: translate(-8%, 0) rotate(-6deg) scale(1); }
    to   { transform: translate(14%, 10%) rotate(4deg) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(10%, 0) rotate(8deg) scale(1.1); }
    to   { transform: translate(-12%, -12%) rotate(-4deg) scale(0.95); }
  }
  /* fine scanline texture over the veils — a hint of 'signal' */
  .screen::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.22) 3px 4px);
    pointer-events: none;
  }
  .status { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--color-steel); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .status em { color: var(--color-ember); font-style: normal; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  .ctrl { display: flex; gap: 8px; }
  button { font-family: inherit; background: none; border: 1px solid var(--color-iron); color: var(--color-fog); padding: 5px 14px; cursor: pointer; font-size: var(--text-caption); border-radius: var(--r); }
  button:hover { border-color: var(--color-slate); color: var(--color-paper); }
  button.primary { background: var(--color-ember); border-color: var(--color-ember); color: #000; font-weight: var(--weight-bold); }
  .label { color: var(--color-steel); font-size: var(--text-caption); letter-spacing: .12em; text-transform: uppercase; }
  .screen.live .veil, .screen.live .status { display: none; }
  .screen.live::after { display: none; }
  .screen.live .frame { display: block; }
  .frame { display: none; width: 100%; height: 100%; border-radius: 12px;
    background:
      radial-gradient(circle at 30% 20%, #2b3a55 0%, transparent 55%),
      radial-gradient(circle at 75% 70%, #3d2b46 0%, transparent 50%),
      var(--color-graphite); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">B · aurora veil</div>
    <div class="phone"><div class="screen" id="screen">
      <div class="veil cool"></div>
      <div class="veil warm"></div>
      <div class="status">stream <em>connecting</em></div>
      <div class="frame"></div>
    </div></div>
    <div class="ctrl">
      <button class="primary" onclick="document.getElementById('screen').classList.remove('live')">loading</button>
      <button onclick="document.getElementById('screen').classList.add('live')">live</button>
    </div>
  </div>
</body>
</html>
