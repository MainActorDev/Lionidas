<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>wander check — orbit vs ping-pong</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #eee; font-family: ui-monospace, monospace; display: grid; place-items: center; min-height: 100vh; gap: 20px; grid-auto-flow: row; }
  .pair { display: flex; gap: 24px; align-items: flex-start; }
  .case { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .case .name { font-size: 11px; color: #7e7e7e; }
  .screen { position: relative; width: 230px; height: 480px; background: #000; border: 1px solid #202020; border-radius: 12px; overflow: hidden; }
  .veil { position: absolute; width: 150%; height: 75%; filter: blur(42px); border-radius: 50%; }
  .cool { top: -20%; left: -35%; background: radial-gradient(closest-side, #eeeeee, transparent 70%); opacity: .22; animation: wander1 13s ease-in-out infinite; }
  .warm { bottom: -24%; right: -36%; background: radial-gradient(closest-side, #da5c2c, transparent 72%); opacity: .18; animation: wander2 17s ease-in-out infinite; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.22) 3px 4px); }
  @keyframes wander1 {
    0%   { transform: translate(0, 0) rotate(-5deg) scale(1); }
    16%  { transform: translate(18%, 6%) rotate(0deg) scale(1.1); }
    33%  { transform: translate(22%, 22%) rotate(5deg) scale(0.95); }
    50%  { transform: translate(6%, 34%) rotate(9deg) scale(1.06); }
    66%  { transform: translate(-16%, 26%) rotate(4deg) scale(1.12); }
    83%  { transform: translate(-20%, 8%) rotate(-2deg) scale(1.02); }
    100% { transform: translate(0, 0) rotate(-5deg) scale(1); }
  }
  @keyframes wander2 {
    0%   { transform: translate(0, 0) rotate(6deg) scale(1.04); }
    16%  { transform: translate(-14%, -6%) rotate(2deg) scale(0.94); }
    33%  { transform: translate(-20%, -22%) rotate(-4deg) scale(1.1); }
    50%  { transform: translate(-4%, -32%) rotate(-8deg) scale(1.16); }
    66%  { transform: translate(14%, -20%) rotate(-2deg) scale(1); }
    83%  { transform: translate(18%, -6%) rotate(3deg) scale(1.08); }
    100% { transform: translate(0, 0) rotate(6deg) scale(1.04); }
  }
</style>
</head>
<body>
  <div class="pair">
    <div class="case"><div class="screen"><div class="veil cool"></div><div class="veil warm"></div><div class="scan"></div></div><div class="name">orbit wander (shipped)</div></div>
  </div>
</body>
</html>
