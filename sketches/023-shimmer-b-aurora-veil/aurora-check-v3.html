<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>aurora — curtain shimmer (shipped v3)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #eee; font-family: ui-monospace, monospace; display: grid; place-items: center; min-height: 100vh; }
  .case { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .name { font-size: 11px; color: #7e7e7e; letter-spacing: .12em; text-transform: uppercase; }
  .screen { position: relative; width: 248px; height: 520px; background: #000; border: 1px solid #202020; border-radius: 12px; overflow: hidden; }
  .curtain { position: absolute; inset: 0; transform-origin: 50% 0%; animation: sway 11s ease-in-out infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-1.6deg) translateX(-2%); }
    to   { transform: rotate(1.8deg) translateX(2%); }
  }
  .sky { position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(238,238,238,.20) 18%, rgba(218,92,44,.24) 40%, rgba(238,238,238,.10) 62%, transparent 85%);
    filter: blur(22px); }
  .rays { position: absolute; inset: -10% -15%;
    background: repeating-linear-gradient(90deg, transparent 0px, transparent 12px, rgba(238,238,238,.16) 16px, rgba(238,238,238,.05) 24px, transparent 32px, transparent 44px);
    transform: skewX(-10deg);
    filter: blur(7px);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 55%, transparent 88%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 55%, transparent 88%);
    animation: raymarch 9s linear infinite; }
  @keyframes raymarch { from { translate: 0 0; } to { translate: 44px 0; } }
  .pulse { position: absolute; width: 85%; height: 38%; border-radius: 50%; filter: blur(30px); mix-blend-mode: screen; }
  .p1 { top: 6%; left: -12%; background: radial-gradient(closest-side, rgba(238,238,238,.5), transparent 70%); animation: breathe1 4.6s ease-in-out infinite; }
  .p2 { top: 30%; right: -16%; background: radial-gradient(closest-side, rgba(218,92,44,.55), transparent 70%); animation: breathe2 6.4s ease-in-out infinite; }
  @keyframes breathe1 { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: .85; transform: scale(1.25); } }
  @keyframes breathe2 { 0%,100% { opacity: .85; transform: scale(1.18); } 50% { opacity: .25; transform: scale(.9); } }
</style>
</head>
<body>
  <div class="case">
    <div class="screen"><div class="curtain">
      <div class="sky"></div>
      <div class="rays"></div>
      <div class="pulse p1"></div>
      <div class="pulse p2"></div>
    </div></div>
    <div class="name">aurora curtain shimmer</div>
  </div>
</body>
</html>
