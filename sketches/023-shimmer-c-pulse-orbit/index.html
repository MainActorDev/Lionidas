<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>shimmer C — pulse orbit</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-void); color: var(--color-paper); font-family: var(--font-mono); font-size: var(--text-label); min-height: 100vh; display: grid; place-items: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .phone { position: relative; width: 268px; height: 550px; background: var(--color-carbon); border: 1px solid var(--color-slate); border-radius: 22px; padding: 10px; }
  .screen { position: relative; width: 100%; height: 100%; background: var(--color-void); border-radius: 12px; overflow: hidden; display: grid; place-items: center; }

  /* ── VARIANT C: pulse orbit ──
   * A single ember core breathing at the screen's center with concentric
   * rings expanding outward and fading — like a signal radiating from the
   * device. Technical, radar-like; matches the engine/bus language of the
   * cockpit. Plus a thin sweeping second-hand arc for motion continuity. */
  .core { width: 10px; height: 10px; border-radius: 50%; background: var(--color-ember); box-shadow: 0 0 18px 4px rgba(218, 92, 44, .55); animation: corebeat 1.8s ease-in-out infinite; z-index: 2; }
  @keyframes corebeat { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.35); opacity: 1; } }

  .ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--color-ember); opacity: 0; animation: ripple 2.7s cubic-bezier(.2, .6, .35, 1) infinite; }
  .ring:nth-child(2) { animation-delay: .9s; }
  .ring:nth-child(3) { animation-delay: 1.8s; }
  @keyframes ripple {
    0%   { transform: scale(.4); opacity: .55; }
    80%  { opacity: .08; }
    100% { transform: scale(5.2); opacity: 0; }
  }

  /* sweeping arc — a radar second hand */
  .sweep { position: absolute; inset: -45%; background: conic-gradient(from 0deg, rgba(218, 92, 44, .18) 0deg, transparent 70deg, transparent 360deg); animation: spin 2.7s linear infinite; -webkit-mask: radial-gradient(circle, transparent 38px, #000 39px); mask: radial-gradient(circle, transparent 38px, #000 39px); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--color-steel); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .status em { color: var(--color-ember); font-style: normal; }

  .ctrl { display: flex; gap: 8px; }
  button { font-family: inherit; background: none; border: 1px solid var(--color-iron); color: var(--color-fog); padding: 5px 14px; cursor: pointer; font-size: var(--text-caption); border-radius: var(--r); }
  button:hover { border-color: var(--color-slate); color: var(--color-paper); }
  button.primary { background: var(--color-ember); border-color: var(--color-ember); color: #000; font-weight: var(--weight-bold); }
  .label { color: var(--color-steel); font-size: var(--text-caption); letter-spacing: .12em; text-transform: uppercase; }
  .screen.live .core, .screen.live .ring, .screen.live .sweep, .screen.live .status { display: none; }
  .screen.live .frame { display: block; }
  .frame { display: none; width: 100%; height: 100%; border-radius: 12px;
    background:
      radial-gradient(circle at 30% 20%, #2b3a55 0%, transparent 55%),
      radial-gradient(circle at 75% 70%, #3d2b46 0%, transparent 50%),
      var(--color-graphite); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">C · pulse orbit</div>
    <div class="phone"><div class="screen" id="screen">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="sweep"></div>
      <div class="core"></div>
      <div class="status">acquiring <em>frame 1</em></div>
      <div class="frame"></div>
    </div></div>
    <div class="ctrl">
      <button class="primary" onclick="document.getElementById('screen').classList.remove('live')">loading</button>
      <button onclick="document.getElementById('screen').classList.add('live')">live</button>
    </div>
  </div>
</body>
</html>
