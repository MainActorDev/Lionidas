<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>040 — audit log, full shadcn demo</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* Factory dark tokens as plain CSS vars (used by the few hand rules below). */
:root{--background:#101010;--foreground:#eeeeee;--muted-foreground:#b8b3b0;--border-c:#3d3a39;--status-orange:#ee6018;--status-green:#a0ca92;--ring:#b8b3b0}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:400 14px/1.5 'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
<style type="text/tailwindcss">
/* Same values theme.css ships — registered as Tailwind theme so utilities
   like bg-background/text-muted-foreground generate. MUST live in a
   text/tailwindcss block for the runtime to read it. */
@theme{
  --color-background:#101010;--color-foreground:#eeeeee;--color-card:#1d1a18;
  --color-card-foreground:#eeeeee;--color-popover:#1d1a18;--color-popover-foreground:#eeeeee;
  --color-primary:#1d1a18;--color-primary-foreground:#eeeeee;--color-secondary:#262220;
  --color-secondary-foreground:#eeeeee;--color-muted:#1d1a18;--color-muted-foreground:#b8b3b0;
  --color-accent:#262220;--color-accent-foreground:#eeeeee;--color-destructive:#ee6018;
  --color-border:#3d3a39;--color-input:#3d3a39;--color-ring:#b8b3b0;
  --color-sidebar:#101010;--color-sidebar-foreground:#eeeeee;--color-sidebar-accent:#262220;
  --color-sidebar-accent-foreground:#eeeeee;--color-sidebar-border:#3d3a39;
  --color-status-orange:#ee6018;--color-status-green:#a0ca92;
  --radius-sm:1px;--radius-md:3px;--radius-lg:7px;
  --font-mono:'Geist Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
  --font-sans:'Geist',ui-sans-serif,system-ui,sans-serif;
}
</style>
</head>
<body>

<div class="flex min-h-svh w-full">

  <!-- ── Sidebar (shadcn Sidebar anatomy; mobile = Sheet overlay) ── -->
  <aside data-slot="sidebar" id="sidebar" class="fixed inset-y-0 left-0 z-30 hidden w-64 shrink-0 border-r border-sidebar-border bg-sidebar md:sticky md:top-0 md:flex md:h-svh md:translate-x-0" aria-label="primary">
    <div class="flex h-full flex-col">
      <div class="flex h-16 items-center gap-2 border-b border-sidebar-border px-4">
        <span class="size-1.5 rounded-full bg-status-orange"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-foreground/80"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".35"/></svg>
        <span class="font-mono text-sm font-medium tracking-[0.14em] uppercase">lionidas</span>
      </div>
      <nav class="flex-1 overflow-y-auto px-2 py-3" aria-label="main navigation" id="nav"></nav>
      <div class="border-t border-sidebar-border p-4 font-mono text-[10px] uppercase tracking-wider text-muted-foreground">admin</div>
    </div>
  </aside>
  <div data-slot="sheet-overlay" id="navOverlay" hidden class="fixed inset-0 z-20 bg-black/60 md:hidden"></div>

  <!-- ── SidebarInset (main column) ── -->
  <main class="relative flex min-w-0 flex-1 flex-col">

    <!-- topbar -->
    <header class="sticky top-0 z-20 flex h-14 items-center gap-2 border-b bg-background px-4" data-slot="sidebar-inset">
      <button data-slot="sidebar-trigger" id="navOpen" class="inline-flex size-7 items-center justify-center rounded-md text-muted-foreground hover:bg-accent hover:text-accent-foreground md:hidden" aria-label="open menu" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="flex-1"></span>
      <span class="hidden font-mono text-xs text-muted-foreground sm:inline">QA Harness · admin</span>
      <button data-slot="button" class="inline-flex h-7 items-center rounded-md border border-input bg-background px-3 text-xs font-medium hover:bg-accent hover:text-accent-foreground">sign out</button>
      <span data-slot="badge" class="inline-flex items-center rounded-md border px-1.5 py-0 text-[11px] font-medium text-muted-foreground">⌘K</span>
    </header>

    <!-- page -->
    <div class="flex-1 p-6">

      <!-- page header (shadcn composition: title + description + actions) -->
      <div class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b pb-4">
        <div>
          <h1 class="font-mono text-2xl font-medium tracking-tight">audit log</h1>
          <p class="mt-1 font-mono text-sm text-muted-foreground">who did what, when — <span id="count">16</span> events in range</p>
        </div>
        <span data-slot="badge" class="inline-flex items-center rounded-md border px-2 py-0.5 font-mono text-xs font-medium text-muted-foreground">retention 90d</span>
      </div>

      <div class="grid gap-6 lg:grid-cols-[200px_minmax(0,1fr)]">

        <!-- facet rail -->
        <aside class="hidden lg:block" aria-label="filters">
          <div class="pt-3.5">
            <div class="mb-2 flex items-center font-mono text-[10px] uppercase tracking-[0.08em] text-muted-foreground">event class <button class="ml-auto text-[10px] hover:text-foreground" data-clear>clear</button></div>
            <div class="flex flex-col gap-0.5" id="facets" role="group" aria-label="event class"></div>
            <div class="mb-2 mt-5 font-mono text-[10px] uppercase tracking-[0.08em] text-muted-foreground">actors</div>
            <div class="flex flex-col gap-0.5" id="actors" role="group" aria-label="actors"></div>
          </div>
        </aside>

        <!-- ledger column -->
        <section class="min-w-0" aria-label="audit ledger">

          <!-- toolbar: Input + Tabs -->
          <div class="mb-4 flex flex-wrap items-center gap-2">
            <label data-slot="input" class="flex h-9 min-w-0 flex-1 items-center gap-2 rounded-md border border-input bg-card px-3 text-sm focus-within:border-ring md:max-w-md">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 text-muted-foreground"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="q" type="text" placeholder="search actor, event, detail…" aria-label="search audit log" class="w-full bg-transparent font-mono text-xs text-foreground outline-none placeholder:text-muted-foreground">
              <kbd class="shrink-0 rounded-sm border px-1.5 font-mono text-[10px] text-muted-foreground">↵</kbd>
            </label>
            <div data-slot="tabs" role="tablist" aria-label="time grouping" class="inline-flex h-9 items-center justify-center rounded-md border bg-background p-0.5 text-muted-foreground">
              <button role="tab" aria-selected="true" data-tab="day" data-state="active" class="inline-flex h-8 items-center rounded-[2px] px-3 font-mono text-xs data-[state=active]:bg-secondary data-[state=active]:text-foreground">day</button>
              <button role="tab" aria-selected="false" data-tab="continuous" data-state="inactive" class="inline-flex h-8 items-center rounded-[2px] px-3 font-mono text-xs data-[state=active]:bg-secondary data-[state=active]:text-foreground">continuous</button>
            </div>
          </div>

          <!-- Table (sticky thead beneath the 56px topbar; outer radius so corners read) -->
          <div class="rounded-md border [&>table]:rounded-t-md">
            <table data-slot="table" class="w-full caption-bottom text-sm">
              <thead data-slot="table-header" class="sticky top-14 z-10 bg-background">
                <tr data-slot="table-row" class="border-b transition-colors">
                  <th data-slot="table-head" class="h-9 w-16 px-3 text-left align-middle font-mono text-[10px] font-normal uppercase tracking-[0.08em] text-muted-foreground">time</th>
                  <th data-slot="table-head" class="h-9 hidden px-3 text-left align-middle font-mono text-[10px] font-normal uppercase tracking-[0.08em] text-muted-foreground md:table-cell">actor</th>
                  <th data-slot="table-head" class="h-9 hidden px-3 text-left align-middle font-mono text-[10px] font-normal uppercase tracking-[0.08em] text-muted-foreground lg:table-cell">event</th>
                  <th data-slot="table-head" class="h-9 px-3 text-left align-middle font-mono text-[10px] font-normal uppercase tracking-[0.08em] text-muted-foreground">detail</th>
                </tr>
              </thead>
              <tbody data-slot="table-body" id="rows"></tbody>
            </table>
            <p id="empty" hidden class="px-3 py-10 text-center font-mono text-sm text-muted-foreground">no events match</p>
          </div>

          <!-- Pagination -->
          <div class="mt-4 flex items-center justify-between">
            <span class="font-mono text-xs text-muted-foreground">page 1 of 1</span>
            <div class="flex gap-1">
              <button data-slot="button" aria-label="previous page" class="inline-flex size-8 items-center justify-center rounded-md border border-input bg-background text-muted-foreground hover:bg-accent hover:text-accent-foreground">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button data-slot="button" aria-label="page 1" class="inline-flex size-8 items-center justify-center rounded-md border border-ring bg-secondary font-mono text-xs">1</button>
              <button data-slot="button" aria-label="next page" class="inline-flex size-8 items-center justify-center rounded-md border border-input bg-background text-muted-foreground hover:bg-accent hover:text-accent-foreground">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- ── detail Sheet (right) ── -->
<div data-slot="sheet-overlay" id="sheetOverlay" hidden class="fixed inset-0 z-40 bg-black/60"></div>
<div data-slot="sheet-content" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle" class="fixed inset-y-0 right-0 z-50 flex w-[85vw] max-w-sm flex-col border-l bg-background focus:outline-none sm:max-w-md" tabindex="-1">
  <div data-slot="sheet-header" class="flex items-start justify-between gap-2 border-b p-4">
    <div>
      <h2 data-slot="sheet-title" id="sheetTitle" class="font-mono text-base font-medium"></h2>
      <p class="mt-0.5 font-mono text-xs text-muted-foreground"></p>
    </div>
    <button data-slot="sheet-close" id="sheetClose" aria-label="close" class="absolute right-4 top-4 rounded-sm text-muted-foreground hover:text-foreground">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div data-slot="sheet-body" class="flex-1 overflow-y-auto p-4">
    <dl id="sheetKv" class="grid grid-cols-[88px_minmax(0,1fr)] gap-x-3 gap-y-1.5 font-mono text-xs"></dl>
    <div class="mt-4 border-t pt-3 font-mono text-[10px] uppercase tracking-[0.08em] text-muted-foreground">raw record</div>
    <pre id="sheetRaw" class="mt-2 overflow-x-auto rounded-md border bg-muted p-3 font-mono text-[11px] leading-relaxed text-muted-foreground"></pre>
  </div>
</div>

<script>
/* ── data (same fixture family as web/e2e/routes.ts) ── */
const ROWS=[
 {t:'09:00:00',d:'Thu 15 Oct',actor:'a.pratama@lionparcel.com',ev:'login',cls:'auth',detail:'session opened · web · 10.14.88.2'},
 {t:'06:00:00',d:'Thu 15 Oct',actor:'ci-bot@lionparcel.com',ev:'run_play',cls:'runs',detail:'case login-flow on iPhone 16 · b-7741 · variant en-US · passed in 42s'},
 {t:'03:00:00',d:'Thu 15 Oct',actor:'n.wijaya@lionparcel.com',ev:'rbac_denied',cls:'rbac',detail:'users: list — denied for operator (role below supervisor)'},
 {t:'01:30:00',d:'Thu 15 Oct',actor:'ci-bot@lionparcel.com',ev:'build_trigger',cls:'devices',detail:'project prj_6035c50f-2a0b by admin — triggered from cockpit after merge of feat/recipe-onboarding into develop, build 382'},
 {t:'22:10:00',d:'Wed 14 Oct',actor:'a.pratama@lionparcel.com',ev:'logout',cls:'auth',detail:'session closed after 4h 12m'},
 {t:'20:45:00',d:'Wed 14 Oct',actor:'n.wijaya@lionparcel.com',ev:'run_abort',cls:'runs',detail:'aborted after 34s (operator) — device reclaimed for manual session'},
 {t:'18:05:00',d:'Wed 14 Oct',actor:'a.pratama@lionparcel.com',ev:'case_edit',cls:'cases',detail:'steps 4→7 edited on case login-flow (added OTP verification step)'},
 {t:'15:30:00',d:'Wed 14 Oct',actor:'n.wijaya@lionparcel.com',ev:'manual_take_control',cls:'devices',detail:'device iPhone 16 · manual control 90s · 3 screenshots captured'},
 {t:'12:20:00',d:'Wed 14 Oct',actor:'system',ev:'login_failed',cls:'auth',detail:'bad password · web · 10.14.88.9'},
 {t:'10:00:00',d:'Wed 14 Oct',actor:'a.pratama@lionparcel.com',ev:'role_changed',cls:'accounts',detail:'role operator → supervisor by a.pratama'},
 {t:'08:40:00',d:'Wed 14 Oct',actor:'ci-bot@lionparcel.com',ev:'device_action',cls:'devices',detail:'screenshot batch (12) uploaded to evidence store'},
 {t:'07:15:00',d:'Wed 14 Oct',actor:'n.wijaya@lionparcel.com',ev:'password_changed',cls:'accounts',detail:'self password change (no reset token)'},
 {t:'05:00:00',d:'Wed 14 Oct',actor:'a.pratama@lionparcel.com',ev:'login',cls:'auth',detail:'session opened · web · 10.14.88.2'},
 {t:'21:00:00',d:'Tue 13 Oct',actor:'n.wijaya@lionparcel.com',ev:'rbac_denied',cls:'rbac',detail:'builds: trigger — denied for operator (role below supervisor)'},
 {t:'19:30:00',d:'Tue 13 Oct',actor:'ci-bot@lionparcel.com',ev:'build_trigger',cls:'devices',detail:'project prj_6035c50f-2a0b by admin — triggered from chat, build 381'},
];
const DOT={auth:'bg-muted-foreground',runs:'bg-status-green',rbac:'bg-status-orange'};
const NAV=[['testing',[['overview','#',0],['suites','#',0],['devices','#',0],['runs','#',0]]],['ci',[['projects','#',0],['builds','#',0]]],['agent',[['chat','#',0]]],['system',[['status','#',1]]],['library',[['test cases','#',0],['screens','#',0],['env','#',0],['network','#',0]]],['settings',[['users','#',0],['audit log','#',1],['configs','#',0]]]];
const FACETS=[['all events','all'],['auth','auth'],['accounts','accounts'],['runs','runs'],['cases','cases'],['devices','devices'],['rbac denials','rbac']];
const ACTORS=[['a.pratama@lionparcel.com','a.pratama'],['ci-bot@lionparcel.com','ci-bot'],['n.wijaya@lionparcel.com','n.wijaya'],['system','system']];
let q='',cls='all',actor='',tab='day';

/* nav */
const nav=document.getElementById('nav');
for(const[group,items]of NAV){
 const g=document.createElement('div');g.className='group relative';
 g.innerHTML=`<button class="flex w-full items-center rounded-sm px-2 py-1.5 font-mono text-[10px] uppercase tracking-[0.07em] text-muted-foreground/70 hover:text-muted-foreground" aria-expanded="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chev transition-transform"><path d="m6 9 6 6 6-6"/></svg><span class="ml-1.5">${group}</span></button>`;
 const list=document.createElement('div');list.className='ml-2 flex flex-col gap-0.5 border-l border-sidebar-border pl-2';
 for(const[label,href,active]of items){
  const a=document.createElement('a');a.href=href;a.textContent=label;
  a.className='flex items-center gap-2 rounded-sm px-2 py-1.5 font-mono text-xs text-muted-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground'+(active?' bg-sidebar-accent font-medium text-sidebar-accent-foreground':'');
  list.append(a);
 }
 g.querySelector('button').addEventListener('click',()=>{const open=list.toggleAttribute('hidden');g.querySelector('.chev').style.transform=open?'rotate(-90deg)':'';g.querySelector('button').setAttribute('aria-expanded',String(!open))});
 g.append(list);nav.append(g);
}
/* facets */
const fWrap=document.getElementById('facets');
for(const[label,key]of FACETS){
 const n=ROWS.filter(r=>key==='all'||r.cls===key).length;
 const b=document.createElement('button');b.dataset.cls=key;
 b.className='flex items-center gap-2 rounded-sm border border-transparent px-1.5 py-1 font-mono text-xs text-muted-foreground hover:bg-secondary hover:text-foreground';
 b.innerHTML=`<span class="size-[5px] rounded-full ${DOT[key]??'bg-border'}"></span>${label}<span class="ml-auto text-[11px] text-muted-foreground">${n}</span>`;
 b.addEventListener('click',()=>{cls=cls===key?'all':key;render()});
 fWrap.append(b);
}
const aWrap=document.getElementById('actors');
for(const[label,key]of ACTORS){
 const n=ROWS.filter(r=>r.actor===label).length;
 const b=document.createElement('button');b.dataset.actor=key;
 b.className='flex items-center gap-2 rounded-sm border border-transparent px-1.5 py-1 font-mono text-xs text-muted-foreground hover:bg-secondary hover:text-foreground';
 b.innerHTML=`<span class="size-[5px] rounded-full bg-muted-foreground/60"></span><span class="truncate">${label.split('@')[0]}</span><span class="ml-auto text-[11px] text-muted-foreground">${n}</span>`;
 b.addEventListener('click',()=>{actor=actor===key?'':key;render()});
 aWrap.append(b);
}
document.querySelector('[data-clear]').addEventListener('click',()=>{cls='all';actor='';q='';document.getElementById('q').value='';render()});

/* rows */
function render(){
 const rows=ROWS.filter(r=>(cls==='all'||r.cls===cls)&&(!actor||r.actor.startsWith(actor))&&(!q||(r.actor+' '+r.ev+' '+r.detail).toLowerCase().includes(q)));
 document.getElementById('count').textContent=rows.length;
 const tb=document.getElementById('rows');tb.replaceChildren();
 let lastDay='';
 for(const r of rows){
  if(tab==='day'&&r.d!==lastDay){
   lastDay=r.d;
   const dr=document.createElement('tr');dr.className='border-b bg-background/95';
   dr.innerHTML=`<td colspan="4" class="px-3 py-2 font-mono text-xs font-medium">${r.d}<span class="ml-2 text-[11px] font-normal text-muted-foreground">${rows.filter(x=>x.d===r.d).length} events</span></td>`;
   tb.append(dr);
  }
  const tr=document.createElement('tr');tr.tabIndex=0;tr.setAttribute('role','button');tr.setAttribute('aria-label',`${r.t} ${r.ev} ${r.detail}`);
  tr.className='cursor-pointer border-b transition-colors hover:bg-secondary/60 focus-visible:bg-secondary/60';
  tr.innerHTML=`
   <td class="whitespace-nowrap px-3 py-2 align-baseline font-mono text-[11px] text-muted-foreground">${r.t}</td>
   <td class="hidden max-w-[200px] truncate px-3 py-2 align-baseline font-mono text-xs text-muted-foreground md:table-cell">${r.actor}</td>
   <td class="hidden px-3 py-2 align-baseline lg:table-cell"><span data-slot="badge" class="inline-flex items-center gap-1.5 rounded-md border px-1.5 py-0 font-mono text-[11px] font-medium ${r.cls==='rbac'?'border-destructive/40 text-status-orange':'text-muted-foreground'}"><span class="size-[5px] rounded-full ${DOT[r.cls]??'bg-border'}"></span>${r.ev}</span></td>
   <td class="max-w-0 truncate px-3 py-2 align-baseline text-[13px]">${r.detail}</td>`;
  const open=()=>openSheet(r);
  tr.addEventListener('click',open);
  tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  tb.append(tr);
 }
 document.getElementById('empty').hidden=rows.length>0;
 /* facet active states */
 fWrap.querySelectorAll('button').forEach(b=>{const on=b.dataset.cls===cls;b.classList.toggle('bg-secondary',on);b.classList.toggle('text-foreground',on);b.classList.toggle('border-input',on)});
 aWrap.querySelectorAll('button').forEach(b=>{const on=b.dataset.actor===actor;b.classList.toggle('bg-secondary',on);b.classList.toggle('text-foreground',on);b.classList.toggle('border-input',on)});
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>{x.dataset.state=x===b?'active':'inactive';x.setAttribute('aria-selected',String(x===b))});render()}));

/* sheet */
const sheet=document.getElementById('sheet'),overlay=document.getElementById('sheetOverlay');
function openSheet(r){
 document.getElementById('sheetTitle').textContent=r.ev;
 sheet.querySelector('[data-slot="sheet-header"] p').textContent=r.d+' · '+r.t;
 document.getElementById('sheetKv').innerHTML=[['when',`${r.d}, ${r.t}`],['actor',r.actor],['class',r.cls],['detail',r.detail]].map(([k,v])=>`<dt class="text-muted-foreground">${k}</dt><dd class="break-all">${v}</dd>`).join('');
 document.getElementById('sheetRaw').textContent=JSON.stringify({at:1792054800000,email:r.actor,event:r.ev,detail:r.detail},null,2);
 sheet.hidden=false;overlay.hidden=false;document.body.style.overflow='hidden';
 sheet.focus();sheet.querySelector('[data-slot="sheet-close"]').addEventListener('click',closeSheet,{once:true});
}
function closeSheet(){sheet.hidden=true;overlay.hidden=true;document.body.style.overflow=''}
overlay.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeNav()}});

/* mobile nav sheet */
const sidebar=document.getElementById('sidebar'),navOverlay=document.getElementById('navOverlay'),navBtn=document.getElementById('navOpen');
function closeNav(){if(innerWidth>=768)return;sidebar.classList.add('hidden');navOverlay.hidden=true;navBtn.setAttribute('aria-expanded','false')}
navBtn.addEventListener('click',()=>{sidebar.classList.remove('hidden');navOverlay.hidden=false;navBtn.setAttribute('aria-expanded','true');sidebar.querySelector('a')?.focus()});
navOverlay.addEventListener('click',closeNav);

render();
</script>
</body>
</html>
