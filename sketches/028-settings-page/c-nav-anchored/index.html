<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>028-C · settings — nav-anchored</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--color-void); color: var(--color-paper); font-family: var(--font-mono); }
  .page { max-width: 860px; margin: 0 auto; padding: var(--s-6); display: grid; grid-template-columns: 160px 1fr; gap: var(--s-6); }
  .ph { grid-column: 1 / -1; margin-bottom: 0; }
  .ph-row1 { display: flex; align-items: center; gap: var(--s-4); padding-bottom: var(--s-2); }
  .ph-title { font-size: var(--text-heading-sm); }
  .ph-row2 { font-size: var(--text-label); color: var(--color-ash); padding: var(--s-2) 0; border-top: 1px solid var(--color-iron); }
  .nav a { display: block; padding: var(--s-2) var(--s-3); font-size: var(--text-label); color: var(--color-fog); text-decoration: none; border-left: 2px solid transparent; cursor: pointer; }
  .nav a.on { color: var(--color-paper); background: var(--color-carbon); border-left-color: var(--color-ember); }
  .nav a:hover { color: var(--color-paper); }
  .section-label { font-size: var(--text-caption); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-steel); margin-bottom: var(--s-2); }
  .card { background: var(--color-carbon); border: 1px solid var(--color-iron); padding: var(--s-4); margin-bottom: var(--s-5); }
  .row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) 0; border-bottom: 1px solid var(--color-iron); font-size: var(--text-label); }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--color-fog); min-width: 130px; }
  .row .v { color: var(--color-steel); }
  .btn { font-family: var(--font-mono); font-size: 12px; color: var(--color-paper); background: var(--color-carbon); border: 1px solid var(--color-iron); padding: 4px 12px; cursor: pointer; }
  .btn:hover { background: var(--color-graphite); }
  .btn.danger { color: var(--color-ember); }
  .chip { font-size: 10px; padding: 1px 5px; border: 1px solid var(--color-iron); color: var(--color-ash); text-transform: uppercase; }
  .chip.on { color: var(--color-ember); border-color: var(--color-ember-dim); }
</style>
</head>
<body>
<div class="page">
  <div class="ph">
    <div class="ph-row1"><span class="ph-title">settings</span></div>
    <div class="ph-row2">instance configuration — grows over time · admin only</div>
  </div>
  <nav class="nav">
    <a class="on">credentials</a>
    <a>storage</a>
    <a style="color: var(--color-steel;">…future sections</a>
  </nav>
  <div>
    <div class="section-label">project credentials</div>
    <div class="card">
      <div class="row"><span class="k">intl-app</span><span class="chip on">token</span><span class="v">write-only · never displayed</span><span style="margin-left:auto"><button class="btn">replace…</button> <button class="btn danger">clear</button></span></div>
      <div class="row"><span class="k">consumer</span><span class="chip">none</span><span class="v">public repo</span><span style="margin-left:auto"><button class="btn">add token…</button></span></div>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', () => {
  document.querySelectorAll('.nav a').forEach(x => x.classList.remove('on'));
  a.classList.add('on');
}));
</script>
</body>
</html>
