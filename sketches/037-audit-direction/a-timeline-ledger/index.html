<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>037 audit — A · timeline ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Factory tokens — same vocabulary as tokens.css/theme.css */
:root {
  --void:#101010; --carbon:#1d1a18; --carbon-lift:#232020; --iron:#3d3a39;
  --steel:#8a8380; --ash:#b8b3b0; --chalk:#eeeeee;
  --ember:#ee6018; --ok:#a0ca92;
  --font:'Geist',ui-sans-serif,system-ui,sans-serif;
  --mono:'Geist Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font);background:var(--void);color:var(--chalk);-webkit-font-smoothing:antialiased;line-height:1.5}
button{background:none;border:none;color:inherit;font:inherit;cursor:pointer}

.wrap{display:grid;grid-template-columns:200px 1fr;max-width:1280px;margin:0 auto;padding:0 24px;gap:0;min-height:100vh}
aside{border-right:1px solid var(--iron);padding:24px 16px 24px 0}

/* ── header: single line, filters inline ── */
.head{display:flex;align-items:baseline;gap:12px;padding:22px 0 14px;border-bottom:1px solid var(--iron);flex-wrap:wrap}
h1{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:-.01em}
.count{font-family:var(--mono);font-size:12px;color:var(--steel)}
.spacer{flex:1}

/* ── toolbar: search-first ── */
.toolbar{display:flex;gap:8px;padding:14px 0;align-items:center;flex-wrap:wrap}
.q{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--iron);border-radius:3px;padding:7px 10px;background:var(--carbon)}
.q:focus-within{border-color:var(--ash)}
.q input{background:none;border:none;color:var(--chalk);font-family:var(--mono);font-size:12px;outline:none;flex:1}
.q .k{font-family:var(--mono);font-size:10px;color:var(--steel);border:1px solid var(--iron);border-radius:3px;padding:1px 5px}
.seg{display:flex;border:1px solid var(--iron);border-radius:3px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:11px;padding:7px 12px;color:var(--steel)}
.seg button.on{background:var(--carbon);color:var(--chalk)}
.seg button+button{border-left:1px solid var(--iron)}

/* ── the ledger: dense rows, no table chrome ── */
.ledger{border-top:1px solid var(--iron)}
.day{position:sticky;top:0;background:var(--void);z-index:2;display:flex;align-items:baseline;gap:10px;padding:10px 12px 6px;border-bottom:1px solid var(--iron)}
.day .d{font-family:var(--mono);font-size:12px;font-weight:500}
.day .n{font-family:var(--mono);font-size:11px;color:var(--steel)}
.row{display:grid;grid-template-columns:64px 200px 150px 1fr;gap:14px;padding:7px 12px;border-bottom:1px solid rgba(61,58,57,.4);align-items:baseline}
.row:hover{background:var(--carbon)}
.row .t{font-family:var(--mono);font-size:11px;color:var(--steel)}
.row .who{font-family:var(--mono);font-size:12px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who .sys{color:var(--steel)}
.ev{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ash)}
.ev::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--iron)}
.ev.auth::before{background:var(--ash)}
.ev.runs::before{background:var(--ok)}
.ev.rbac::before,.ev.denied::before{background:var(--ember)}
.ev.rbac{color:var(--ember)}
.row .what{font-size:13px;color:var(--chalk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .what .dim{color:var(--steel)}
.more{margin:14px 0 40px;font-family:var(--mono);font-size:12px;border:1px solid var(--iron);border-radius:3px;padding:7px 14px;color:var(--ash)}
.more:hover{border-color:var(--ash);color:var(--chalk)}
.empty{padding:48px 0;color:var(--steel);font-size:13px}

/* row click → detail panel (feint) */
.row{cursor:default}

/* ── sidebar rail: live facets ── */
.facets{position:sticky;top:0;padding-top:22px;display:flex;flex-direction:column;gap:22px}
.f-h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.f-list{display:flex;flex-direction:column;gap:2px}
.f{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ash);padding:3px 6px;border-radius:3px;border:1px solid transparent}
.f:hover{background:var(--carbon);color:var(--chalk)}
.f.on{background:var(--carbon);border-color:var(--iron);color:var(--chalk)}
.f .dot{width:5px;height:5px;border-radius:50%;background:var(--iron);flex-shrink:0}
.f.auth .dot{background:var(--ash)}
.f.runs .dot{background:var(--ok)}
.f.rbac .dot{background:var(--ember)}
.f .n{margin-left:auto;color:var(--steel);font-size:11px}
.f-h .clear{margin-left:auto;font-size:10px;color:var(--steel)}
.f-h .clear:hover{color:var(--chalk)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{display:none}
  .row{grid-template-columns:56px 1fr;grid-template-rows:auto auto}
  .row .who{grid-column:2}
  .row .ev{grid-column:2}
  .row .what{grid-column:1/-1;grid-row:2;color:var(--ash)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="facets">
      <div>
        <div class="f-h">event class <button class="clear">clear</button></div>
        <div class="f-list" id="facetList">
          <button class="f on all"><span class="dot"></span>all events <span class="n">128</span></button>
          <button class="f auth"><span class="dot"></span>auth <span class="n">41</span></button>
          <button class="f"><span class="dot"></span>accounts <span class="n">12</span></button>
          <button class="f runs"><span class="dot"></span>runs <span class="n">36</span></button>
          <button class="f"><span class="dot"></span>cases <span class="n">9</span></button>
          <button class="f"><span class="dot"></span>devices <span class="n">18</span></button>
          <button class="f rbac"><span class="dot"></span>rbac denials <span class="n">12</span></button>
        </div>
      </div>
      <div>
        <div class="f-h">actors</div>
        <div class="f-list">
          <button class="f on"><span class="dot" style="background:var(--ash)"></span>a.pratama@… <span class="n">64</span></button>
          <button class="f"><span class="dot" style="background:var(--ash)"></span>n.wijaya@… <span class="n">31</span></button>
          <button class="f"><span class="dot" style="background:var(--ash)"></span>ci-bot <span class="n">21</span></button>
          <button class="f"><span class="dot" style="background:var(--ash)"></span>system <span class="n">12</span></button>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <header class="head">
      <h1>audit log</h1>
      <span class="count" id="count">128 events · 4 actors · 14d</span>
      <span class="spacer"></span>
      <span class="count">retention 90d</span>
    </header>

    <div class="toolbar">
      <label class="q">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--steel)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="search actor, event, detail…" aria-label="search audit log">
        <span class="k">↵</span>
      </label>
      <div class="seg" role="tablist" aria-label="time grouping">
        <button class="on" role="tab" aria-selected="true">day</button>
        <button role="tab" aria-selected="false">continuous</button>
      </div>
    </div>

    <div class="ledger" id="ledger"></div>
    <button class="more" id="more">load more</button>
    <p class="empty" id="empty" hidden>no events match</p>
  </main>
</div>

<script>
/* fake-but-realistic data, same shape as /api/audit rows */
const CLASSES={login:'auth',login_failed:'auth',logout:'auth',session_killed:'auth',approved:'accounts',unapproved:'accounts',role_changed:'accounts',active_changed:'accounts',password_changed:'accounts',bot_token_rotated:'accounts',run_play:'runs',run_abort:'runs',case_create:'cases',case_edit:'cases',case_delete:'cases',manual_take_control:'devices',manual_release:'devices',device_action:'devices',build_trigger:'devices',rbac_denied:'rbac'};
const ACTORS=[['a.pratama@lionparcel.com','A. Pratama'],['n.wijaya@lionparcel.com','N. Wijaya'],['ci-bot','ci-bot'],['system','system']];
const DETAILS={login:'session opened · web · 10.14.88.2',login_failed:'bad password · web · 10.14.88.2',logout:'session closed',session_killed:'killed by supervisor (stale)',approved:'approved operator account n.wijaya@…',role_changed:'operator → supervisor',active_changed:'account disabled',password_changed:'self password change',bot_token_rotated:'bot token rotated',run_play:'case <b>login-flow</b> on iPhone 16 · b-7741',run_abort:'aborted after 34s (operator)',case_create:'case login-flow-v3',case_edit:'steps 4→7',case_delete:'case stale-probe',manual_take_control:'device iPhone 16 · 90s',manual_release:'device iPhone 16',device_action:'screenshot batch (12)',build_trigger:'build 382 · develop',rbac_denied:'users: list — denied for operator'};
const now=Date.now(),D=864e5;
let rows=[];
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const EVS=Object.keys(CLASSES);
for(let i=0;i<128;i++){
  const ev=EVS[Math.floor(rnd()*EVS.length)];
  const a=ACTORS[Math.floor(rnd()*(ev==='rbac_denied'?2:4))];
  rows.push({id:i+1,at:now-Math.floor(rnd()*14*D)-i*36e5,ev,email:a[0],name:a[1],detail:DETAILS[ev]+(ev==='login_failed'&&rnd()>.5?'':'')});
}
rows.sort((a,b)=>b.at-a.at);
let q='',cls='all',cont=false;
const $=s=>document.querySelector(s);
function fmt(t){return new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function day(t){return new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function render(){
  const f=rows.filter(r=>(cls==='all'||CLASSES[r.ev]===cls)&&(!q||(r.email+' '+r.ev+' '+r.detail).toLowerCase().includes(q)));
  $('#count').textContent=`${f.length} events · 4 actors · 14d`;
  const L=$('#ledger');L.innerHTML='';
  if(!f.length){$('#empty').hidden=false;$('#more').hidden=true;return}
  $('#empty').hidden=true;$('#more').hidden=f.length<40;
  let lastDay='',html='';
  for(const r of f.slice(0,60)){
    const d=day(r.at);
    if(!cont&&d!==lastDay){const n=f.filter(x=>day(x.at)===d).length;html+=`<div class="day"><span class="d">${d}</span><span class="n">${n} events</span></div>`;lastDay=d}
    html+=`<div class="row"><span class="t">${fmt(r.at)}</span><span class="who" title="${r.email}">${r.name}</span><span class="ev ${CLASSES[r.ev]}">${r.ev}</span><span class="what">${r.detail}</span></div>`;
  }
  L.innerHTML=html;
}
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
document.querySelectorAll('.f').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));b.classList.add('on');cls=b.className.includes('all')?'all':[...b.classList].find(c=>c in CLASSES||c==='rbac')||'all';render()}));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.seg button').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-selected','false')});b.classList.add('on');b.setAttribute('aria-selected','true');cont=b.textContent!=='day';render()}));
$('#more').addEventListener('click',()=>{$('#more').textContent='no more data in sketch'});
render();
</script>
</body>
</html>
