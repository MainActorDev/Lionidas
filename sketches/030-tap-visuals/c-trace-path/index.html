<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>030 c — trace path</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; background: var(--color-void); color: var(--color-fog); font-family: var(--font-mono); display: grid; place-items: center; min-height: 100vh; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone { position: relative; width: 320px; height: 640px; background: linear-gradient(160deg, #16324a 0%, #0e1e2e 45%, #10151c 100%); border: 1px solid var(--color-slate); border-radius: 28px; overflow: hidden; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 26px; display: flex; justify-content: space-between; padding: 6px 16px 0; font-size: 9px; color: #cfd8e3; }
  .app-ui { position: absolute; inset: 26px 0 0 0; padding: 18px; }
  .hero { height: 92px; border-radius: 8px; background: #ffffff10; margin-bottom: 14px; }
  .row { height: 44px; border-radius: 6px; background: #ffffff0d; margin-bottom: 8px; }
  .cta { position: absolute; right: 18px; bottom: 74px; width: 120px; height: 40px; border-radius: 6px; background: #e8662f; }
  .field { position: absolute; left: 18px; bottom: 130px; width: 200px; height: 34px; border-radius: 6px; background: #ffffff16; border: 1px solid #ffffff22; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .caption { font-size: var(--text-caption); color: var(--color-steel); }
  .caption b { color: var(--color-ember); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>▲ ●●</span></div>
      <div class="app-ui"><div class="hero"></div><div class="row"></div><div class="row"></div><div class="row"></div></div>
      <div class="field"></div>
      <div class="cta"></div>
      <canvas id="cv"></canvas>
    </div>
    <div class="caption"><b>c — trace path</b> · numbered story of the flow · last 5 points, older fading</div>
  </div>
<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let points = []; // {x, y, n, t}
  const seq = [
    { x: 90, y: 180 },
    { x: 260, y: 330 },
    { x: 100, y: 500 },
    { x: 230, y: 560 },
    { x: 160, y: 240 },
    { x: 60, y: 420 },
  ];
  let n = 0;
  setInterval(() => { points.push({ ...seq[n % seq.length], n: n + 1, t: performance.now() }); n++; points = points.slice(-5); }, 1300);
  function loop(now) {
    const r = cv.parentElement.getBoundingClientRect();
    if (cv.width !== Math.floor(r.width)) { cv.width = r.width; cv.height = r.height; }
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (points.length === 0) { requestAnimationFrame(loop); return; }
    const newest = points[points.length - 1];
    const newestAge = now - newest.t;
    // path: connect the surviving points (orthogonal-elbowed, app-flow feel)
    ctx.lineWidth = 1.5;
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      const depth = points.length - 1 - i; // 0 = newest segment
      const alpha = Math.max(0.12, 0.85 - depth * 0.18);
      ctx.strokeStyle = `rgba(234,110,52,${alpha})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, a.y); // elbow
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // numbered dots + newest pulse
    points.forEach((p, i) => {
      const depth = points.length - 1 - i;
      const alpha = Math.max(0.15, 1 - depth * 0.2);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,0,0,${0.75 * alpha})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(234,110,52,${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = `rgba(238,238,238,${alpha})`;
      ctx.font = 'bold 9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(p.n), p.x, p.y + 0.5);
    });
    // pulse ring on the newest point for ~1400ms
    if (newestAge < 1400) {
      const p = Math.min(1, newestAge / 1400);
      ctx.beginPath();
      ctx.arc(newest.x, newest.y, 8 + 18 * p, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(234,110,52,${1 - p})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
