<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>032 A3-1 — claude-faithful (empty state → thread)</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-mono); font-size: var(--text-body); color: var(--color-paper); line-height: 1.65; overflow: hidden;
    background: radial-gradient(1100px 550px at 70% -10%, rgba(218,92,44,0.07), transparent 60%), radial-gradient(800px 450px at -10% 110%, rgba(218,92,44,0.05), transparent 55%), var(--color-void); }

  .app { display: flex; height: 100vh; }

  /* ── sidebar: Claude anatomy — brand, search, New, recents, footer ── */
  .side { width: 268px; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  .orb { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--color-ember), var(--color-ember-dim) 70%); box-shadow: 0 0 16px rgba(218,92,44,0.45); }
  .brand .t { font-family: Georgia, serif; font-size: 18px; }
  .search { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; background: rgba(25,25,25,0.75); box-shadow: inset 0 0 0 1px var(--color-iron); color: var(--color-steel); }
  .search input { flex: 1; background: none; border: none; outline: none; color: var(--color-paper); font-family: var(--font-mono); font-size: var(--text-caption); }
  .nav-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; font-size: var(--text-caption); color: var(--color-fog); cursor: pointer; }
  .nav-row:hover { background: rgba(25,25,25,0.8); color: var(--color-paper); }
  .nav-row.new { background: rgba(218,92,44,0.10); color: var(--color-paper); box-shadow: inset 0 0 0 1px rgba(218,92,44,0.25); }
  .nav-row .ic { width: 16px; text-align: center; }
  .recents-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-steel); padding: 8px 14px 2px; }
  .convs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .conv { padding: 8px 14px; border-radius: 12px; font-size: var(--text-caption); color: var(--color-fog); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv:hover { background: rgba(25,25,25,0.8); color: var(--color-paper); }
  .conv.on { background: rgba(218,92,44,0.10); color: var(--color-paper); }
  .conv .sub { font-size: 9px; color: var(--color-steel); margin-top: 1px; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px 2px; border-top: 1px solid var(--color-iron); }
  .foot .av { width: 28px; height: 28px; border-radius: 50%; background: var(--color-carbon); box-shadow: inset 0 0 0 1px var(--color-slate); display: grid; place-items: center; font-size: 10px; color: var(--color-fog); }
  .foot .nm { font-size: var(--text-caption); } .foot .pl { font-size: 9px; color: var(--color-steel); }
  .foot .chev { margin-left: auto; color: var(--color-steel); cursor: pointer; }

  /* ── main: empty state (greeting + centered composer) ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 8vh; }
  .empty .mark { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--color-ember), var(--color-ember-dim) 75%); box-shadow: 0 0 28px rgba(218,92,44,0.5); display: grid; place-items: center; font-size: 16px; }
  .empty .hi { font-family: Georgia, serif; font-size: 30px; }
  .empty .sub { font-size: var(--text-caption); color: var(--color-steel); margin-top: -14px; }

  /* composer — Claude shape: rounded box, controls INSIDE, bottom row */
  .composer { width: min(680px, 90%); border-radius: 22px; padding: 14px 16px 10px; background: rgba(17,17,17,0.94); box-shadow: inset 0 0 0 1px var(--color-slate), 0 12px 40px rgba(0,0,0,0.55); transition: box-shadow 140ms ease; }
  .composer:focus-within { box-shadow: inset 0 0 0 1px rgba(218,92,44,0.55), 0 12px 44px rgba(0,0,0,0.6), 0 0 26px rgba(218,92,44,0.15); }
  .composer .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
  .composer textarea { width: 100%; background: none; border: none; outline: none; color: var(--color-paper); font-family: var(--font-mono); font-size: var(--text-body); resize: none; min-height: 32px; }
  .composer .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: none; box-shadow: inset 0 0 0 1px var(--color-iron); color: var(--color-ash); cursor: pointer; font-size: 13px; }
  .icon-btn:hover { color: var(--color-ember); box-shadow: inset 0 0 0 1px rgba(218,92,44,0.4); }
  .exec-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 10px; color: var(--color-fog); background: rgba(25,25,25,0.9); box-shadow: inset 0 0 0 1px var(--color-iron); cursor: pointer; }
  .exec-pill:hover { color: var(--color-paper); }
  .exec-pill .arr { font-size: 8px; color: var(--color-steel); }
  .send { width: 32px; height: 32px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 30%, var(--color-ember), var(--color-ember-dim) 75%); color: var(--color-paper); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 16px rgba(218,92,44,0.4); font-size: 13px; margin-left: auto; opacity: 0.25; pointer-events: none; transition: opacity 140ms ease; }
  .send.ready { opacity: 1; pointer-events: auto; }
  .hint { font-size: 9px; color: var(--color-steel); }

  /* ── thread state ── */
  .thread { flex: 1; overflow-y: auto; display: none; }
  .thread-inner { max-width: 760px; margin: 0 auto; padding: 26px 24px 200px; display: flex; flex-direction: column; gap: 22px; }
  .msg { display: flex; gap: 14px; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; }
  .avatar.you { color: var(--color-fog); background: var(--color-carbon); box-shadow: inset 0 0 0 1px var(--color-iron); }
  .avatar.agent { color: var(--color-paper); background: radial-gradient(circle at 35% 30%, var(--color-ember), var(--color-ember-dim) 75%); box-shadow: 0 0 14px rgba(218,92,44,0.4); }
  .body { max-width: 78%; min-width: 0; }
  .msg.user .body { background: var(--color-graphite); border-radius: 18px 18px 4px 18px; padding: 11px 16px; box-shadow: inset 0 0 0 1px var(--color-iron); }
  .msg.agent .body { max-width: 100%; }
  .who { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-steel); margin-bottom: 5px; }
  .txt { white-space: pre-wrap; }
  .atts { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  .att { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 10px; color: var(--color-fog); background: rgba(0,0,0,0.5); box-shadow: inset 0 0 0 1px var(--color-iron); }
  .att.jira { color: var(--color-ember); box-shadow: inset 0 0 0 1px rgba(218,92,44,0.45); }

  .flow { display: flex; align-items: center; margin: 10px 0 4px; }
  .node { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--color-steel); }
  .node .b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; background: var(--color-carbon); box-shadow: inset 0 0 0 1px var(--color-slate); }
  .node.done .b { color: var(--color-paper); background: var(--color-graphite); } .node.done .b::before { content: '✓'; }
  .node.now .b { color: var(--color-paper); background: radial-gradient(circle at 35% 30%, var(--color-ember), var(--color-ember-dim) 75%); box-shadow: 0 0 12px rgba(218,92,44,0.55); animation: pulse 1.3s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .link { flex: 0 0 22px; height: 1px; background: linear-gradient(90deg, var(--color-slate), var(--color-iron)); margin: 0 6px; }
  .link.done { background: var(--color-slate); }
  .tool { font-size: var(--text-caption); color: var(--color-steel); margin-top: 8px; font-style: italic; cursor: pointer; }
  .tool::before { content: '⌁ '; color: var(--color-ember-dim); }

  .qblock { margin-top: 12px; border-radius: 18px; padding: 16px 18px; background: linear-gradient(160deg, rgba(218,92,44,0.12), rgba(218,92,44,0.05)); box-shadow: inset 0 0 0 1px rgba(218,92,44,0.35), 0 8px 30px rgba(218,92,44,0.12); }
  .qblock .qlabel { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-ember); margin-bottom: 6px; }
  .qblock .qt { font-family: Georgia, serif; font-size: 16px; line-height: 1.5; margin-bottom: 10px; }
  .qblock textarea { width: 100%; border-radius: 14px; padding: 10px 14px; background: rgba(0,0,0,0.55); border: none; outline: none; box-shadow: inset 0 0 0 1px var(--color-iron); color: var(--color-paper); font-family: var(--font-mono); font-size: var(--text-caption); resize: vertical; min-height: 46px; }
  .qblock .row { display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end; }
  .btn { display: inline-flex; align-items: center; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--color-slate); color: var(--color-fog); font-family: var(--font-mono); font-size: var(--text-caption); padding: 6px 16px; cursor: pointer; }
  .btn:hover { color: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-fog); }
  .btn-primary { background: var(--color-ember); box-shadow: 0 4px 18px rgba(218,92,44,0.35); color: var(--color-paper); font-weight: 600; border: none; }
  .btn-primary:hover { transform: translateY(-1px); }

  .drafts { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .draft { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 9px 14px; background: var(--color-carbon); box-shadow: inset 0 0 0 1px var(--color-iron); font-size: var(--text-caption); }
  .draft::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--color-ember), transparent); }
  .draft .fl { color: var(--color-steel); font-size: 10px; } .draft .st { margin-left: auto; font-size: 9px; color: var(--color-ember); }

  /* docked composer (thread state) */
  .composer-wrap { position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none; display: none; }
  .composer-wrap .composer { pointer-events: auto; margin: 0 auto 22px; }
</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="orb"></div><span class="t">butler</span></div>
      <div class="search">⌕<input id="search" placeholder="Search" oninput="filterConvs()"></div>
      <div class="nav-row new" onclick="newChat()"><span class="ic">＋</span>New</div>
      <div class="recents-label">recents</div>
      <div class="convs" id="convs">
        <div class="conv" onclick="pick(this)">payments regression sweep<div class="sub">com.lionparcel · 18 drafts · 1h</div></div>
        <div class="conv" onclick="pick(this)">onboarding flows<div class="sub">com.foo · done · 3d</div></div>
        <div class="conv" onclick="pick(this)">QR checkout spec<div class="sub">com.lionparcel · 5 drafts · 4d</div></div>
      </div>
      <div class="foot"><div class="av">BK</div><div><div class="nm">Bayu</div><div class="pl">operator</div></div><span class="chev">⌄</span></div>
    </aside>

    <main class="main">
      <!-- empty state -->
      <div class="empty" id="empty">
        <div class="mark">✦</div>
        <div class="hi">Good evening.</div>
        <div class="sub">attach a ticket, PR, or spec — I'll draft the cases.</div>
        <div class="composer">
          <div class="chips" id="chips"></div>
          <textarea id="ta" placeholder="what are we testing?" oninput="taChanged()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
          <div class="row">
            <button class="icon-btn" title="attach references (jira / pr / doc / repo)" onclick="attach()">＋</button>
            <span class="hint">enter to send</span>
            <div class="exec-pill" id="exec" onclick="cycleExec()" title="executor for this chat"><span id="execName">glm-4.7</span><span class="arr">⌄</span></div>
            <button class="send" id="send" onclick="send()">↑</button>
          </div>
        </div>
      </div>

      <!-- thread -->
      <div class="thread" id="thread"><div class="thread-inner" id="ti"></div></div>
      <div class="composer-wrap" id="cw"><div class="composer">
        <div class="chips" id="chips2"></div>
        <textarea id="ta2" placeholder="reply to butler…" oninput="ta2Changed()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send2();}"></textarea>
        <div class="row"><button class="icon-btn" onclick="attach2()">＋</button><span class="hint">enter to send</span><div class="exec-pill"><span id="execName2">glm-4.7</span><span class="arr">⌄</span></div><button class="send" id="send2" onclick="send2()">↑</button></div>
      </div></div>
    </main>
  </div>

<script>
// ── working state ──
const refs = [];
const EXECUTORS = ['glm-4.7', 'claude-sonnet', 'mock'];
let execIdx = 0;

function renderChips() {
  const html = refs.map((r, i) => `<span class="att ${r.jira ? 'jira' : ''}" onclick="refs.splice(${i},1);renderChips()">${r.jira ? '◈' : '△'} ${r.name} ✕</span>`).join('');
  document.getElementById('chips').innerHTML = html;
  document.getElementById('chips2').innerHTML = html;
}
function attach() { refs.push({ name: 'DEMO-10' + (refs.length + 1), jira: true }); renderChips(); }
function attach2() { refs.push({ name: 'PR #48' + (refs.length + 2), jira: false }); renderChips(); }
function taChanged() { document.getElementById('send').classList.toggle('ready', document.getElementById('ta').value.trim().length > 0); }
function ta2Changed() { document.getElementById('send2').classList.toggle('ready', document.getElementById('ta2').value.trim().length > 0); }
function cycleExec() { execIdx = (execIdx + 1) % EXECUTORS.length; document.getElementById('execName').textContent = EXECUTORS[execIdx]; document.getElementById('execName2').textContent = EXECUTORS[execIdx]; }

function filterConvs() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.conv').forEach((c) => { c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}
function pick(el) { document.querySelectorAll('.conv').forEach((c) => c.classList.remove('on')); el.classList.add('on'); }
function newChat() {
  document.querySelectorAll('.conv').forEach((c) => c.classList.remove('on'));
  document.getElementById('empty').style.display = '';
  document.getElementById('thread').style.display = 'none';
  document.getElementById('cw').style.display = 'none';
  document.getElementById('ti').innerHTML = '';
  refs.length = 0; renderChips();
  document.getElementById('ta').value = ''; taChanged();
}

function send() {
  const ta = document.getElementById('ta');
  const text = ta.value.trim(); if (!text) return;
  document.getElementById('empty').style.display = 'none';
  document.getElementById('thread').style.display = '';
  document.getElementById('cw').style.display = '';
  addUserMsg(text, true);
  ta.value = ''; taChanged();
  agentReply();
}
function send2() {
  const ta = document.getElementById('ta2');
  const text = ta.value.trim(); if (!text) return;
  addUserMsg(text, false);
  ta.value = ''; ta2Changed();
}
function addUserMsg(text, withRefs) {
  const atts = withRefs && refs.length ? `<div class="atts">${refs.map((r) => `<span class="att ${r.jira ? 'jira' : ''}">${r.jira ? '◈' : '△'} ${r.name}</span>`).join('')}</div>` : '';
  document.getElementById('ti').insertAdjacentHTML('beforeend', `
    <div class="msg user"><div class="body"><div class="txt">${text}</div>${atts}</div><div class="avatar you">you</div></div>`);
  scrollBottom();
}
function agentReply() {
  document.getElementById('ti').insertAdjacentHTML('beforeend', `
    <div class="msg agent"><div class="avatar agent">✦</div><div class="body">
      <div class="who">butler</div>
      <div class="flow">
        <div class="node done"><span class="b"></span>knowledge</div><div class="link done"></div>
        <div class="node done"><span class="b"></span>plan</div><div class="link done"></div>
        <div class="node now" id="curNode"><span class="b">✦</span><span id="curName">breakdown</span></div><div class="link" id="curLink"></div>
        <div class="node" id="nextNode"><span class="b"></span>author</div>
      </div>
      <div class="txt" style="margin-top:10px;">Knowledge v3 compiled — 3 refs integrated, 1 contradiction flagged (checkout identifier).</div>
      <div class="tool">read screens registry · searched notes app:com.lionparcel/*</div>
      <div class="qblock" id="q">
        <div class="qlabel">✦ a question before I continue</div>
        <div class="qt">Biometric login — Face ID <em>and</em> passcode fallback, or passcode only for v1?</div>
        <textarea id="qa" placeholder="type your answer…"></textarea>
        <div class="row"><button class="btn" onclick="skipQ()">skip</button><button class="btn btn-primary" onclick="answerQ()">answer &amp; continue</button></div>
      </div>
      <div class="drafts" id="drafts" style="display:none;">
        <div class="draft">login/ biometric-entry <span class="fl">· validator ✓</span><span class="st">draft</span></div>
        <div class="draft">login/ pin-expiry-recovery <span class="fl">· validator ✓</span><span class="st">draft</span></div>
        <div class="draft">payments/ qr-checkout <span class="fl">· validator ✓</span><span class="st">draft</span></div>
      </div>
    </div></div>`);
  scrollBottom();
}
function answerQ() {
  document.getElementById('q').style.display = 'none';
  document.getElementById('drafts').style.display = '';
  document.getElementById('curNode').classList.remove('now'); document.getElementById('curNode').classList.add('done'); document.getElementById('curNode').querySelector('.b').textContent = '';
  document.getElementById('curLink').classList.add('done');
  document.getElementById('nextNode').classList.add('now'); document.getElementById('nextNode').querySelector('.b').textContent = '✦';
  setTimeout(() => {
    document.getElementById('nextNode').classList.remove('now'); document.getElementById('nextNode').classList.add('done');
    document.getElementById('nextNode').querySelector('.b').textContent = '';
  }, 1600);
  scrollBottom();
}
function skipQ() { answerQ(); }
function scrollBottom() { const t = document.getElementById('thread'); t.scrollTop = t.scrollHeight; }
</script>
</body>
</html>
