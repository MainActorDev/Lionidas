<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>018-B · banner strip</title>
<style>
:root {
  --color-void:#000; --color-carbon:#111; --color-graphite:#191919; --color-iron:#202020;
  --color-slate:#3a3a3a; --color-pewter:#505050; --color-steel:#606060; --color-ash:#7e7e7e;
  --color-fog:#b4b4b4; --color-chalk:#d9d9d9; --color-paper:#eeeeee; --color-ember:#da5c2c;
  --color-amber:#d9a03f;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --text-caption:12px; --text-body:14px; --text-label:13px; --text-heading-sm:18px;
  --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --r:2px; --t:120ms cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--color-void); color:var(--color-paper); font-family:var(--font-mono); font-size:var(--text-body); line-height:1.5; padding:24px 32px; max-width:1100px; margin:0 auto; }
button { background:none; border:none; color:inherit; font:inherit; cursor:pointer; }
a { color:inherit; }

.hd-row1 { display:flex; align-items:center; gap:16px; margin-bottom:8px; }
.hd-title { font-size:var(--text-heading-sm); font-weight:700; letter-spacing:-0.01em; }
.hd-spacer { flex:1; }
.hd-row2 { padding-bottom:16px; border-bottom:1px solid var(--color-iron); margin-bottom:0; }

/* ═══ B: BANNER STRIP — verdict rides the page rule: status + cause on one
   emphatic line under the header, everything else stays flat sections ═══ */
.banner {
  display:flex; align-items:baseline; gap:16px;
  padding:16px 0; border-bottom:1px solid var(--color-iron);
}
.banner .word { font-size:20px; font-weight:700; color:var(--color-ember); flex:none; }
.banner .cause { font-size:var(--text-label); color:var(--color-fog); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.banner .cause b { color:var(--color-paper); font-weight:400; }
.banner.blocked { border-bottom-style:dashed; }
.chips { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 20px; align-items:baseline; }
.chip { font-size:var(--text-caption); color:var(--color-steel); }
.chip b { color:var(--color-fog); font-weight:400; }
.chip a { color:var(--color-fog); text-decoration:none; border-bottom:1px dotted var(--color-slate); }
.actions { display:flex; gap:8px; margin-left:auto; align-items:center; }
.btn { border:1px solid var(--color-slate); color:var(--color-paper); padding:4px 10px; font-size:var(--text-caption); border-radius:var(--r); }
.btn:hover { border-color:var(--color-chalk); }
.btn-ghost { color:var(--color-fog); }

.section-label { font-size:var(--text-caption); font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--color-steel); margin:20px 0 8px; display:flex; gap:8px; align-items:baseline; cursor:pointer; }
.section-label .n { color:var(--color-pewter); font-weight:400; }
.section-label .arrow { margin-left:auto; color:var(--color-pewter); }
.section-label:hover { color:var(--color-fog); }
.card { border:1px solid var(--color-iron); border-radius:var(--r); overflow:hidden; }
table { width:100%; border-collapse:collapse; }
th { font-size:var(--text-caption); font-weight:400; color:var(--color-steel); text-align:left; padding:8px 12px; border-bottom:1px solid var(--color-iron); }
td { padding:8px 12px; font-size:var(--text-label); border-bottom:1px solid var(--color-iron); }
tbody tr:last-child td { border-bottom:none; }
.status { font-size:var(--text-caption); }
.status-skip { color:var(--color-amber); }
.muted { color:var(--color-steel); }
label.page { font-size:var(--text-caption); color:var(--color-ember); letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:16px; }
</style>
</head>
<body>

<label class="page">018-B — banner strip (verdict line rides the header rule; cause + chips inline, actions right)</label>

<div class="hd-row1">
  <span class="hd-title">run_381fd68d</span>
  <span class="hd-spacer"></span>
</div>
<div class="hd-row2"></div>

<div class="banner">
  <span class="word">✕ failed</span>
  <span class="cause">blocked by system dialog: <b>Allow “Lion Parcel” to use your location?</b></span>
</div>
<div class="chips">
  <span class="chip"><a href="#">tnc</a></span>
  <span class="chip">device <b>30B28173</b></span>
  <span class="chip">build <b>v1.2.0</b></span>
  <span class="chip">duration <b>0m 12s</b></span>
  <span class="chip">by <b>qa</b></span>
  <div class="actions">
    <button class="btn">open case →</button>
    <button class="btn btn-ghost">attach → jira</button>
    <button class="btn btn-ghost">back to log →</button>
  </div>
</div>

<div class="section-label">steps <span class="n">· 1</span><span class="arrow">▸</span></div>

<div class="section-label">network <span class="n">· 0 — proxy was not running</span><span class="arrow">▸</span></div>

<div class="section-label">raw <span class="arrow">▸</span></div>

<script>
document.querySelectorAll('.section-label').forEach((t) => t.addEventListener('click', () => {
  const arrow = t.querySelector('.arrow');
  arrow.textContent = arrow.textContent === '▸' ? '▾' : '▸';
}));
</script>
</body>
</html>
