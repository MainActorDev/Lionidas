name: SweepFixture
options:
  bundleIdPrefix: com.lionparcel.crucible
  deploymentTarget:
    iOS: "17.0"
targets:
  SweepFixture:
    type: application
    platform: iOS
    sources:
      - SweepFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lionparcel.crucible.sweepfixture
        PRODUCT_NAME: SweepFixture
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
